<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>guns.gs</title>
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
<canvas id="game"></canvas>
<section id="start-screen" aria-label="GUNS start screen">
  <div class="start-panel">
    <form id="start-form" autocomplete="off">
      <input
        id="pilot-nick"
        name="pilotNick"
        type="text"
        maxlength="14"
        placeholder="PILOT"
        aria-label="PILOT"
      />
      <button type="submit">ПОЕХАЛИ</button>
      <div id="start-version" aria-label="Game version"></div>
    </form>
  </div>
</section>
<script src="./src/config/runtime-config.js"></script>
<script src="./src/domain/entity-access.js"></script>
<script src="./src/admin/admin-api.js"></script>
<script src="./src/net/network-adapter.js"></script>
<script src="./src/app/start-screen.js"></script>
<script src="./src/legacy/gunsdemo22-runtime.js"></script>
</body>
</html>
