<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>guns.gs</title>
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
<canvas id="game"></canvas>
<section id="start-screen" aria-label="GUNS start screen" data-i18n-aria="start.aria">
  <div class="start-panel">
    <div class="language-switch" aria-label="Language" data-i18n-aria="language.aria">
      <button type="button" data-language-option="ru" data-i18n="language.ru">РУССКИЙ</button>
      <button type="button" data-language-option="en" data-i18n="language.en">ENGLISH</button>
    </div>
    <!-- <div id="skin-switch" class="skin-switch" aria-label="Skin" data-i18n-aria="skin.aria"></div> -->
    <div id="unsupported-device" class="unsupported-device hidden" role="status" aria-live="polite">
      <strong data-i18n="unsupported.title">DESKTOP ONLY</strong>
      <span data-i18n="unsupported.message">Sorry, GUNS.GS currently supports only desktop systems with a mouse and keyboard.</span>
    </div>
    <form id="start-form" autocomplete="off">
      <input
        id="pilot-nick"
        name="pilotNick"
        type="text"
        maxlength="14"
        aria-label="PILOT"
        data-i18n-aria="start.nickPlaceholder"
      />
      <select id="room-select" class="room-select" aria-label="ROOM"></select>
      <div id="auth-panel" class="auth-panel hidden" aria-live="polite">
        <div id="auth-message" class="auth-message"></div>
        <input
          id="pilot-password"
          type="password"
          maxlength="128"
          autocomplete="current-password"
          placeholder="PASSWORD"
        />
        <input
          id="pilot-password-repeat"
          type="password"
          maxlength="128"
          autocomplete="new-password"
          placeholder="REPEAT PASSWORD"
        />
        <div class="auth-actions">
          <button type="button" id="auth-confirm">OK</button>
          <button type="button" id="auth-cancel">BACK</button>
        </div>
      </div>
      <div id="nick-choice-panel" class="nick-choice-panel hidden" role="dialog" aria-live="polite">
        <button type="button" id="nick-choice-close" class="nick-choice-close" aria-label="Close">×</button>
        <div id="nick-choice-message" class="auth-message"></div>
        <div class="nick-choice-actions">
          <button type="button" id="nick-choice-play">PLAY</button>
          <button type="button" id="nick-choice-register">REGISTER AND PLAY</button>
        </div>
      </div>
      <div id="logged-in-panel" class="logged-in-panel hidden" aria-live="polite">
        <div id="logged-in-message" class="logged-in-message"></div>
        <button type="button" id="logged-in-play" data-i18n="start.play">GO</button>
        <button type="button" id="auth-logout" class="auth-logout">LOGOUT</button>
      </div>
      <button type="submit" id="guest-go" data-i18n="start.play">GO</button>
      <div id="start-version" aria-label="Game version" data-i18n-aria="start.versionAria"></div>
    </form>
  </div>
</section>
