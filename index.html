<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>guns.gs</title>
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
<canvas id="game"></canvas>
<section id="start-screen" aria-label="GUNS start screen" data-i18n-aria="start.aria">
  <div class="start-panel">
    <div class="language-switch" aria-label="Language" data-i18n-aria="language.aria">
      <button type="button" data-language-option="ru" data-i18n="language.ru">РУССКИЙ</button>
      <button type="button" data-language-option="en" data-i18n="language.en">ENGLISH</button>
    </div>
    <!-- <div id="skin-switch" class="skin-switch" aria-label="Skin" data-i18n-aria="skin.aria"></div> -->
    <form id="start-form" autocomplete="off">
      <input
        id="pilot-nick"
        name="pilotNick"
        type="text"
        maxlength="14"
        placeholder="PILOT"
        aria-label="PILOT"
        data-i18n-placeholder="start.nickPlaceholder"
        data-i18n-aria="start.nickPlaceholder"
      />
      <div id="auth-panel" class="auth-panel hidden" aria-live="polite">
        <div id="auth-message" class="auth-message"></div>
        <input
          id="pilot-password"
          type="password"
          maxlength="128"
          autocomplete="current-password"
          placeholder="PASSWORD"
        />
        <input
          id="pilot-password-repeat"
          type="password"
          maxlength="128"
          autocomplete="new-password"
          placeholder="REPEAT PASSWORD"
        />
        <div class="auth-actions">
          <button type="button" id="auth-confirm">OK</button>
          <button type="button" id="auth-cancel">BACK</button>
        </div>
      </div>
      <div id="auth-status" class="auth-status"></div>
      <button type="submit" data-i18n="start.play">GO</button>
      <button type="button" class="tutorial-button" data-i18n="start.tutorial">TUTORIAL</button>
      <button type="button" id="auth-logout" class="auth-logout hidden">LOGOUT</button>
      <div id="start-version" aria-label="Game version" data-i18n-aria="start.versionAria"></div>
    </form>
  </div>
</section>
<script src="./src/config/runtime-config.js"></script>
<script src="./src/i18n/i18n.js"></script>
<script src="./src/domain/entity-access.js"></script>
<script src="./src/admin/admin-api.js"></script>
<script src="./src/net/network-adapter.js"></script>
<script src="./src/app/start-screen.js"></script>
<script src="./src/legacy/gunsdemo22-runtime.js"></script>
</body>
</html>
