<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GUNS Panel</title>
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
<main class="shell auth-locked">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <strong>GUNS</strong>
        <span>PANEL</span>
      </div>
    </div>
    <div class="panel-version" id="panel-version">v0.1.12</div>
    <nav>
      <button class="nav-item active" type="button" data-view="users">Users</button>
      <button class="nav-item" type="button" data-view="devices">Devices</button>
      <button class="nav-item" type="button" data-view="sessions">Sessions</button>
      <button class="nav-item" type="button" data-view="objects">Objects</button>
      <button class="nav-item" type="button" data-view="rooms">Rooms</button>
      <button class="nav-item" type="button" data-view="modes">Modes</button>
      <button class="nav-item" type="button" data-view="settings">Settings</button>
      <button class="nav-item" type="button" data-view="camera">Camera</button>
      <button class="nav-item" type="button" data-view="economy">Economy</button>
      <button class="nav-item" type="button" data-view="wallet">Wallet</button>
      <button class="nav-item" type="button" data-view="audit">Audit</button>
      <button class="nav-item" type="button" data-view="database">Database</button>
      <button class="nav-item" type="button" data-view="config">Config</button>
    </nav>
  </aside>

  <section class="workspace">
    <header class="toolbar">
      <div>
        <p class="eyebrow">guns.gs admin</p>
        <h1 id="view-title">Users</h1>
      </div>
      <div class="server-state" id="server-state">Connecting</div>
    </header>

    <section class="metrics" id="metrics" aria-label="Panel metrics">
      <article>
        <span id="metric-total-label">Total</span>
        <strong id="metric-total">0</strong>
      </article>
      <article>
        <span id="metric-online-label">Online</span>
        <strong id="metric-online">0</strong>
      </article>
      <article>
        <span id="metric-connections-label">Connections</span>
        <strong id="metric-connections">0</strong>
      </article>
      <article>
        <span id="metric-uptime-label">Uptime</span>
        <strong id="metric-uptime">--</strong>
      </article>
    </section>

    <section class="table-wrap" id="table-wrap">
      <table>
        <thead id="table-head">
          <tr>
            <th>ID</th>
            <th>Callsign</th>
            <th>Status</th>
            <th>Online</th>
            <th>Active</th>
            <th>Sessions</th>
            <th>First seen</th>
            <th>Last seen</th>
            <th>Room</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr>
            <td colspan="10" class="empty">No users yet</td>
          </tr>
        </tbody>
      </table>
    </section>
  </section>
</main>

<section class="auth-gate" id="auth-gate">
  <div class="auth-box">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <strong>GUNS</strong>
        <span>PANEL</span>
      </div>
    </div>
    <label for="admin-token-input">ADMIN TOKEN</label>
    <input id="admin-token-input" type="password" autocomplete="current-password" />
    <button id="admin-token-submit" type="button">ENTER</button>
    <p id="admin-token-message">ACCESS REQUIRED</p>
  </div>
</section>

<script src="./src/config.js"></script>
<script src="./src/app.js"></script>
</body>
</html>
