services:
  - type: web
    name: guns-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GUNS_USER_STORE
        value: mongo-collections
      - key: GUNS_MONGO_DATABASE
        value: guns
      - key: GUNS_COOKIE_SECURE
        value: "1"
      - key: GUNS_MONGO_URL
        sync: false
